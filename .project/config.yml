forge: github
tracker: github
target: agent-skills
owner: rmdesmond
repo: idea-to-release
default_branch: main
visibility: public
merge_method: squash
release:
  versioning: semver
  strategy: trunk
  tag_prefix: v
  version_files:          # the Claude Code plugin's manifests (decision 0019)
    - '.claude-plugin/plugin.json:"version":'
    - '.claude-plugin/marketplace.json:"ref":'
review:
  required_approvals: 0   # single maintainer: merge is review (decision 0011)
  code_owners: false
pipeline:
  stages:
    lint:
      enabled: true
      run: "scripts/check-adapters.sh && scripts/check-plan.sh"
    build:
      enabled: false
      reason: "Markdown and shell scripts; nothing to compile"
    unit:
      enabled: true
      coverage_min: null
      run: "tests/run.sh"
    integration:
      enabled: false
      reason: "End-to-end runs need GitHub credentials and a person to confirm admin steps; they are plan tasks, not automated"
  extra_stages:
    - name: shellcheck
      runs_on: [change_request]
      mode: advisory
      run: "shellcheck scripts/*.sh tests/*.sh adapters/*/*/*.sh"
