forge: github
tracker: github
owner: rmdesmond
repo: idea-to-release
default_branch: main
visibility: private
merge_method: squash
release:
  versioning: semver
  strategy: trunk
  tag_prefix: v
review:
  required_approvals: 1
  code_owners: false
pipeline:
  stages:
    lint:
      enabled: true
    build:
      enabled: false
      reason: "Markdown and shell scripts; nothing to compile"
    unit:
      enabled: true
      coverage_min: null
    integration:
      enabled: false
      reason: "End-to-end runs need GitHub credentials and a person to confirm admin steps; they are plan tasks, not automated"
  extra_stages:
    - name: shellcheck
      runs_on: [change_request]
      mode: advisory
