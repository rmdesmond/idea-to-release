# Generated by accept-the-plan from .project/config.yml (conventions §11).
# Do not edit by hand: change the config and render it again (accept-the-plan, or work-issue for a task that enables a stage).
name: pipeline

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    tags: ['rel-*']
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.event.pull_request.number || github.ref }}-${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:full') && 'other-label' || 'run' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    if: (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || startsWith(github.head_ref, 'chore/release-')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: lint
        shell: bash
        run: |
          npm run lint

  build:
    name: build
    if: (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || startsWith(github.head_ref, 'chore/release-')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build
        shell: bash
        run: |
          npm run build

  unit:
    name: unit
    if: (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || startsWith(github.head_ref, 'chore/release-')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: unit
        shell: bash
        run: |
          npm test -- --grep "fast"

  integration:
    name: integration
    # Disabled: Needs the vendor's sandbox; see #12
    if: (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || startsWith(github.head_ref, 'chore/release-')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: integration (skipped)
        shell: bash
        run: |
          echo 'skipped: Needs the vendor'\''s sandbox; see #12'

  audit:
    name: audit
    # Extra stage: advisory, runs on change_request, schedule
    if: (github.event_name == 'pull_request' && (contains(github.event.pull_request.labels.*.name, 'ci:full') || startsWith(github.head_ref, 'chore/release-')) && (github.event.action != 'labeled' || github.event.label.name == 'ci:full')) || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: audit
        shell: bash
        run: |
          npm audit

  package:
    name: package
    # Extra stage: required, runs on merge, release
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: package
        shell: bash
        run: |
          npm pack
