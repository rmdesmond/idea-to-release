forge: github
tracker: github
owner: example
repo: example
default_branch: trunk
release:
  versioning: semver
  strategy: trunk
  tag_prefix: rel-
pipeline:
  ci: on-demand          # private repository: CI only with ci:full, release CRs and tags
  stages:
    lint:
      enabled: true
      run: "npm run lint"
    build:
      enabled: true
      run: "npm run build"
    unit:
      enabled: true
      coverage_min: null
      run: "npm test -- --grep \"fast\""   # quotes inside the command
    integration:
      enabled: false
      reason: "Needs the vendor's sandbox; see #12"
  extra_stages:
    - name: audit
      runs_on: [change_request, schedule]
      mode: advisory
      run: "npm audit"
      cron: "30 2 * * *"
    - name: package
      runs_on: [merge, release]
      mode: required
      run: "npm pack"
