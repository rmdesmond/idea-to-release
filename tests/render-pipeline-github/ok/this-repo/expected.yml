# Generated by ci-setup from .project/config.yml (conventions §11).
# Do not edit by hand: change the config and run ci-setup again.
name: pipeline

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  lint:
    name: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: lint
        shell: bash
        run: |
          scripts/check-adapters.sh && scripts/check-plan.sh

  build:
    name: build
    # Disabled: Markdown and shell scripts; nothing to compile
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: build (skipped)
        shell: bash
        run: |
          echo 'skipped: Markdown and shell scripts; nothing to compile'

  unit:
    name: unit
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: unit
        shell: bash
        run: |
          tests/run.sh

  integration:
    name: integration
    # Disabled: End-to-end runs need GitHub credentials and a person to confirm admin steps; they are plan tasks, not automated
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: integration (skipped)
        shell: bash
        run: |
          echo 'skipped: End-to-end runs need GitHub credentials and a person to confirm admin steps; they are plan tasks, not automated'

  shellcheck:
    name: shellcheck
    # Extra stage: advisory, runs on change_request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: shellcheck
        shell: bash
        run: |
          shellcheck scripts/*.sh tests/*.sh
