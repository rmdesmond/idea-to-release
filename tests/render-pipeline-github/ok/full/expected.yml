# Generated by accept-the-plan from .project/config.yml (conventions §11).
# Do not edit by hand: change the config and render it again (accept-the-plan, or work-issue for a task that enables a stage).
name: pipeline

on:
  pull_request:
  push:
    branches: [trunk]
    tags: ['rel-*']
  schedule:
    - cron: '30 2 * * *'

permissions:
  contents: read

jobs:
  lint:
    name: lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: lint
        shell: bash
        run: |
          npm run lint

  build:
    name: build
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/trunk') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build
        shell: bash
        run: |
          npm run build

  unit:
    name: unit
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/trunk') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: unit
        shell: bash
        run: |
          npm test -- --grep "fast"

  integration:
    name: integration
    # Disabled: Needs the vendor's sandbox; see #12
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/trunk') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-'))
    runs-on: ubuntu-latest
    steps:
      - name: integration (skipped)
        shell: bash
        run: |
          echo 'skipped: Needs the vendor'\''s sandbox; see #12'

  audit:
    name: audit
    # Extra stage: advisory, runs on change_request, schedule
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: audit
        shell: bash
        run: |
          npm audit

  package:
    name: package
    # Extra stage: required, runs on merge, release
    if: (github.event_name == 'push' && github.ref == 'refs/heads/trunk') || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/rel-'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: package
        shell: bash
        run: |
          npm pack
